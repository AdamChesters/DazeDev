name: Desktop build
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
defaults:
  run:
    working-directory: apps/desktop
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run gate
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo run --manifest-path src-tauri/Cargo.toml --no-default-features --locked --example transport_smoke
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'apps/desktop/src-tauri -> target', key: portable-complete-v1 }
      - name: Install Vulkan build tools
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - run: npm ci
      - run: node scripts/prepare-runtime.mjs
      - run: npm run build
      - name: Compile native app
        run: ./scripts/build-windows.ps1
      - name: Bundle app-local C++ runtime
        shell: pwsh
        run: ./scripts/bundle-windows-crt.ps1
      - name: Verify offline speech on Windows CPU
        shell: pwsh
        run: |
          . ./scripts/windows-release-env.ps1
          cargo build --release --manifest-path src-tauri/Cargo.toml --features vulkan,custom-protocol --example voice_smoke --example voice_stress --locked
          if ($LASTEXITCODE -ne 0) { throw 'Voice test compilation failed' }
          Get-ChildItem src-tauri/transcribe-libs -Filter *.dll | Copy-Item -Destination src-tauri/target/release/examples -Force
          $sample = Join-Path $env:RUNNER_TEMP 'dazed-jfk.wav'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav' -OutFile $sample
          if ((Get-FileHash $sample -Algorithm SHA256).Hash.ToLower() -ne '59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e') { throw 'Test audio checksum mismatch' }
          & src-tauri/target/release/examples/voice_smoke.exe (Join-Path $env:RUNNER_TEMP 'dazed-models') (Join-Path $PWD 'src-tauri/runtime/llama-server.exe') $sample
          if ($LASTEXITCODE -ne 0) { throw 'Offline speech test failed' }
          & src-tauri/target/release/examples/voice_stress.exe (Join-Path $env:RUNNER_TEMP 'dazed-models') (Join-Path $PWD 'src-tauri/runtime/llama-server.exe') $sample parakeet whisper-turbo
          if ($LASTEXITCODE -ne 0) { throw 'Sustained speech regression failed' }
      - name: Verify portable update and migration logic
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Package one portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Verify portable startup and legacy migration
        shell: pwsh
        run: ./scripts/verify-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DazeDev-Windows-Portable
          path: apps/desktop/artifacts/DazeDev_*_windows-x64.zip
          if-no-files-found: error
          retention-days: 14
