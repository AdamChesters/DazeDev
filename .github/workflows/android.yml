name: Android

# Runs on the project's self-hosted runner when Android or the shared host
# helper changes. It uses no GitHub-hosted minutes.
on:
  push:
    paths:
      - apps/android/**
      - apps/desktop/src-tauri/resources/*.py
      - shared/**
      - scripts/stage-android-assets.mjs
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, dazedev]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Desktop packages for staged terminal assets
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Lint, unit tests with SSH fixtures, debug and release builds
        env:
          BROWSER: /bin/true
        run: python3 apps/android/scripts/check-local.py --fixture-python "$DAZEDEV_FIXTURE_PYTHON"
      - name: Clean up
        if: always()
        run: rm -rf apps/android/app/build apps/android/build apps/desktop/node_modules
