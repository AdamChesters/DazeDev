name: Windows connection verification
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: apps/desktop
permissions:
  contents: read
jobs:
  connection:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked transport::tests -- --nocapture
