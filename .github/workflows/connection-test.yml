name: Windows connection verification
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: apps/desktop
permissions:
  contents: read
jobs:
  connection:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked transport::tests -- --nocapture
