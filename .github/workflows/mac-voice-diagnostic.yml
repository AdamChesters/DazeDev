name: Native Mac voice diagnostics
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: apps/desktop
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      TRANSCRIBE_CMAKE_ARGS: '-DGGML_NATIVE=OFF'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: {workspaces: 'apps/desktop/src-tauri -> target', key: 'unix-portable-v1', cache-on-failure: true}
      - run: node scripts/prepare-runtime.mjs
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml --no-default-features --features voice --example voice_smoke --locked
      - name: Native exit backtrace
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav -o "$RUNNER_TEMP/jfk.wav"
          lldb --batch -o run -k 'thread backtrace all' -k 'process status' -- src-tauri/target/release/examples/voice_smoke "$RUNNER_TEMP/models" "$PWD/src-tauri/runtime/llama-server" "$RUNNER_TEMP/jfk.wav" parakeet
      - name: Crash reports
        if: always()
        run: find "$HOME/Library/Logs/DiagnosticReports" -name 'voice_smoke*' -type f -exec cat {} \;
