[package]
name = "dazedev"
version = "0.3.9-alpha.0"
edition = "2021"
default-run = "DazeDev"
authors = ["Adam Chesters"]
[lib]
name = "dazedev"
crate-type = ["rlib"]
[[bin]]
name = "DazeDev"
path = "src/main.rs"
required-features = ["desktop"]
[features]
default = ["desktop", "voice"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener"]
custom-protocol = ["tauri/custom-protocol"]
voice = ["dep:transcribe-cpp", "dep:ort", "dep:ndarray"]
vulkan = ["transcribe-cpp/vulkan", "transcribe-cpp/dynamic-backends"]
tauri-plugin-opener = ["dep:tauri-plugin-opener"]
[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }
[dependencies]
tauri = { version = "2", optional = true, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
vt100 = "=0.16.2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sha2 = "0.10"
ring = "=0.17.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "multipart"] }
# reqwest uses ring through rustls, matching the pinned ring above.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
transcribe-cpp = { version = "=0.2.3", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
ndarray = { version = "0.17", optional = true }
semver = "1"
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
hmac = "0.13"
sha1 = "0.11"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "process", "time", "sync", "macros"] }
tauri-plugin-opener = { version = "2", optional = true }
[dev-dependencies]
hound = "3.5"
[[example]]
name = "voice_smoke"
required-features = ["voice"]

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }

[[example]]
name = "voice_stress"
required-features = ["voice"]

[[example]]
name = "voice_cache_lifecycle"
required-features = ["voice"]

[[example]]
name = "voice_cache_probe"
required-features = ["voice"]

[[bin]]
name = "DazeDevSession"
path = "src/session_main.rs"
