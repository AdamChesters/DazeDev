<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <link rel="stylesheet" href="index.css" />

  <body>
    <div id="viewport">
      <main id="terminal" aria-label="Interactive terminal"></main>

    <section id="quick" aria-label="Extra keys" hidden></section>
    <section id="keys" aria-label="Terminal keys" hidden></section>
    <script src="index.js"></script>
  </body>
</html>
